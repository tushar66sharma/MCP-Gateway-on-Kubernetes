# Served by nginxinc/nginx-unprivileged (uid 101) as /etc/nginx/conf.d/default.conf. The image's main
# nginx.conf keeps the pid file and temp paths under /tmp, so the root filesystem can be read-only.
# conf.d/*.conf is included inside http {}, so the map and log_format below are allowed here.

# An invite link is a bearer secret, so the access log never holds it: /invite/<token> (any case, any
# number of leading slashes, React Router matches it case-insensitively) is logged as /invite/:token.
# Query strings are dropped from every logged path.
map $request_uri $loggable_uri {
    ~*^/+invite/                  /invite/:token;
    ~^(?<loggable_path>[^?]*)     $loggable_path;
    default                       $request_uri;
}

# No raw $request and no referer (the referer could carry an invite URL from another page).
log_format redacted '$remote_addr - [$time_local] "$request_method $loggable_uri" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Redirects, if any, stay relative so they never leak the container port.
    absolute_redirect off;
    # Replaces the image's http-level `access_log ... main`, which logs the raw request line.
    access_log /dev/stdout redacted;

    # Text assets are compressed (text/html is always included once gzip is on).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Security headers on every response. An add_header inside a location would replace ALL of these,
    # so the locations below only set $cache_control and never call add_header themselves.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Without `always`: sent on successful responses only, so a 404 is never cached as immutable.
    add_header Cache-Control $cache_control;

    set $cache_control "no-cache";

    location = /healthz {
        access_log off;
        default_type text/plain;
        set $cache_control "no-store";
        return 200 'ok';
    }

    # MCP clients probe OAuth metadata here; there is none, so answer 404 instead of the SPA's index.html.
    location ^~ /.well-known/ {
        return 404;
    }

    # Vite puts a content hash in every asset file name, so these can be cached forever.
    location /assets/ {
        set $cache_control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path serves index.html, which must always be revalidated.
    location / {
        set $cache_control "no-cache";
        try_files $uri /index.html;
    }
}
