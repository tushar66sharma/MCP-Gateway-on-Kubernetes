# Served by nginxinc/nginx-unprivileged (uid 101) as /etc/nginx/conf.d/default.conf. The image's main
# nginx.conf keeps the pid file and temp paths under /tmp, so the root filesystem can be read-only.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Redirects, if any, stay relative so they never leak the container port.
    absolute_redirect off;

    # Security headers on every response. An add_header inside a location would replace ALL of these,
    # so the locations below only set $cache_control and never call add_header themselves.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Without `always`: sent on successful responses only, so a 404 is never cached as immutable.
    add_header Cache-Control $cache_control;

    set $cache_control "no-cache";

    location = /healthz {
        access_log off;
        default_type text/plain;
        set $cache_control "no-store";
        return 200 'ok';
    }

    # MCP clients probe OAuth metadata here; there is none, so answer 404 instead of the SPA's index.html.
    location ^~ /.well-known/ {
        return 404;
    }

    # Vite puts a content hash in every asset file name, so these can be cached forever.
    location /assets/ {
        set $cache_control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path serves index.html, which must always be revalidated.
    location / {
        set $cache_control "no-cache";
        try_files $uri /index.html;
    }
}
