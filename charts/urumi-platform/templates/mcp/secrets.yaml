{{- if .Values.mcpWoocommerce.enabled }}
{{- $ns := .Values.namespaces.mcp -}}
{{- if and .Values.store.enabled (not (.Values.mcpWoocommerce.externalStore | default dict).url) (not .Values.secrets.existing.storeWooApi) }}
---
# Copy of the store namespace's store-woo-api (same canonical namespace "store" in the helper, so the
# values are identical). Secrets cannot be shared across namespaces.
apiVersion: v1
kind: Secret
metadata:
  name: store-woo-api
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" "mcp-woocommerce" "component" "mcp-server") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- include "urumi.storeWooApiData" $ | nindent 2 }}
{{- end }}
{{- if not .Values.secrets.existing.mcpWoocommerceToken }}
---
# Bearer token for the WooCommerce MCP server. Canonical namespace: mcp (Phase 3 renders a copy into
# gateway with the same canonical namespace).
apiVersion: v1
kind: Secret
metadata:
  name: mcp-woocommerce-token
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" "mcp-woocommerce" "component" "mcp-server") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ include "urumi.generatedValue" (dict "root" $ "namespace" $ns "secret" "mcp-woocommerce-token" "key" "token" "length" 48) | b64enc | quote }}
{{- end }}
{{- end }}

{{- $mcpNs := .Values.namespaces.mcp }}
{{- if and .Values.mcpNotes.enabled (not .Values.secrets.existing.mcpNotesToken) }}
---
# Bearer token for the Notes MCP server. Canonical namespace: mcp (the gateway namespace gets a copy).
apiVersion: v1
kind: Secret
metadata:
  name: mcp-notes-token
  namespace: {{ $mcpNs }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" "mcp-notes" "component" "mcp-server") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ include "urumi.generatedValue" (dict "root" $ "namespace" $mcpNs "secret" "mcp-notes-token" "key" "token" "length" 48) | b64enc | quote }}
{{- end }}
{{- if and .Values.mcpUtilities.enabled (not .Values.secrets.existing.mcpUtilitiesKey) }}
---
# Key for the Utilities MCP server (sent as X-Utilities-Key). Canonical namespace: mcp.
apiVersion: v1
kind: Secret
metadata:
  name: mcp-utilities-key
  namespace: {{ $mcpNs }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" "mcp-utilities" "component" "mcp-server") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  key: {{ include "urumi.generatedValue" (dict "root" $ "namespace" $mcpNs "secret" "mcp-utilities-key" "key" "key" "length" 48) | b64enc | quote }}
{{- end }}