{{- if .Values.networkPolicies.enabled }}
{{- $ns := .Values.namespaces.mcp }}
{{- $gw := .Values.namespaces.gateway }}
{{- $extUrl := (.Values.mcpWoocommerce.externalStore | default dict).url | default "" }}
{{- $extCidrs := (.Values.mcpWoocommerce.externalStore | default dict).extraEgressCIDRs | default list }}
{{- $servers := list (dict "name" "mcp-woocommerce" "port" 3001) (dict "name" "mcp-notes" "port" 3002) (dict "name" "mcp-utilities" "port" 3003) }}
{{- range $s := $servers }}
---
# {{ $s.name }}: only the gateway in.{{ if eq $s.name "mcp-woocommerce" }} Out: {{ if $extUrl }}the internet on 443 and 80 (a WooCommerce store hosted elsewhere), private ranges excluded{{ else }}the WordPress service (WooCommerce REST){{ end }}.{{ end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $s.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" (printf "%s-netpol" $s.name) "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "urumi.selectorLabels" (dict "root" $ "name" $s.name) | nindent 6 }}
  {{- if eq $s.name "mcp-woocommerce" }}
  policyTypes: [Ingress, Egress]
  {{- else }}
  policyTypes: [Ingress]
  {{- end }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $gw }}
          podSelector:
            matchLabels:
              {{- include "urumi.selectorLabels" (dict "root" $ "name" "gateway") | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ $s.port }} }
  {{- if eq $s.name "mcp-woocommerce" }}
  egress:
    {{- if $extUrl }}
    {{- include "urumi.internetEgress" $ | nindent 4 }}
    {{- range $cidr := $extCidrs }}
    - to:
        - ipBlock:
            cidr: {{ $cidr | quote }}
      ports:
        - { protocol: TCP, port: 443 }
    {{- end }}
    {{- else }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.namespaces.store }}
          podSelector:
            matchLabels:
              {{- include "urumi.selectorLabels" (dict "root" $ "name" "wordpress") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 80 }
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
