{{- if .Values.networkPolicies.enabled }}
{{- $ns := .Values.namespaces.store }}
{{- $mcp := .Values.namespaces.mcp }}
---
# WordPress: Traefik and mcp-woocommerce in; MariaDB and the internet (update checks) out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" "wordpress-netpol" "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "urumi.selectorLabels" (dict "root" $ "name" "wordpress") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- include "urumi.fromTraefik" . | nindent 4 }}
      ports:
        - { protocol: TCP, port: 80 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $mcp }}
          podSelector:
            matchLabels:
              {{- include "urumi.selectorLabels" (dict "root" $ "name" "mcp-woocommerce") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 80 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "urumi.selectorLabels" (dict "root" $ "name" "mariadb") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 3306 }
    {{- include "urumi.internetEgress" . | nindent 4 }}
---
# MariaDB: only WordPress and the store-setup Job in; nothing out (DNS aside).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" "mariadb-netpol" "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "urumi.selectorLabels" (dict "root" $ "name" "mariadb") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "urumi.selectorLabels" (dict "root" $ "name" "wordpress") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "urumi.selectorLabels" (dict "root" $ "name" "store-setup") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 3306 }
---
# store-setup Job: MariaDB and the internet (WooCommerce download) out; nothing in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: store-setup
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" "store-setup-netpol" "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "urumi.selectorLabels" (dict "root" $ "name" "store-setup") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "urumi.selectorLabels" (dict "root" $ "name" "mariadb") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 3306 }
    {{- include "urumi.internetEgress" . | nindent 4 }}
{{- end }}
