{{- /*
cert-manager HTTP-01 solver (production TLS). cert-manager's ingress-shim creates each Certificate in its
Ingress's namespace and starts the temporary cm-acme-http-solver-* pod there, so default-deny-all covers it.
This admits Traefik -> solver on TCP 8089 (cert-manager's fixed acmesolver port). The solver needs no egress
beyond the allow-dns-egress rule every pod already has: it only answers the challenge request.
*/ -}}
{{- if and .Values.networkPolicies.enabled .Values.global.tls.enabled .Values.global.tls.clusterIssuer }}
{{- $namespaces := list .Values.namespaces.store }}
{{- if .Values.gateway.enabled }}
{{- $namespaces = append $namespaces .Values.namespaces.gateway }}
{{- end }}
{{- range $ns := $namespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-http01-solver
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" "acme-http01-solver-netpol" "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    {{- include "urumi.fromTraefik" $ | nindent 4 }}
      ports:
        - { protocol: TCP, port: 8089 }
{{- end }}
{{- end }}
