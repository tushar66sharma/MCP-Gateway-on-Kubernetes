{{- if .Values.networkPolicies.enabled }}
{{- $ns := .Values.namespaces.gateway }}
---
# Gateway: Traefik in; the three MCP servers, Postgres and the internet (LLM providers, external MCP servers) out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" "gateway-netpol" "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "urumi.selectorLabels" (dict "root" $ "name" "gateway") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- include "urumi.fromTraefik" . | nindent 4 }}
      ports:
        - { protocol: TCP, port: 3000 }
  egress:
    {{- range $s := list (dict "name" "mcp-woocommerce" "port" 3001) (dict "name" "mcp-notes" "port" 3002) (dict "name" "mcp-utilities" "port" 3003) }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.namespaces.mcp }}
          podSelector:
            matchLabels:
              {{- include "urumi.selectorLabels" (dict "root" $ "name" $s.name) | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ $s.port }} }
    {{- end }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "urumi.selectorLabels" (dict "root" $ "name" "postgres") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 5432 }
    {{- include "urumi.internetEgress" . | nindent 4 }}
---
# Dashboard: Traefik in; no egress (static files).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" "dashboard-netpol" "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "urumi.selectorLabels" (dict "root" $ "name" "dashboard") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- include "urumi.fromTraefik" . | nindent 4 }}
      ports:
        - { protocol: TCP, port: 8080 }
---
# Postgres: only the gateway in; nothing out (DNS aside).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" "postgres-netpol" "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "urumi.selectorLabels" (dict "root" $ "name" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "urumi.selectorLabels" (dict "root" $ "name" "gateway") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 5432 }
{{- end }}
