{{- if .Values.networkPolicies.enabled }}
{{- range $key, $ns := .Values.namespaces }}
{{- if or $.Values.store.enabled (ne $key "store") }}
---
# Denies all ingress and egress for every pod in the namespace; the allow policies add the exceptions.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" "default-deny-all" "component" "network") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
{{- end }}
{{- end }}
{{- end }}
