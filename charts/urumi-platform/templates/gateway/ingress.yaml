{{- if .Values.gateway.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" "gateway" "component" "gateway") | nindent 4 }}
  {{- if .Values.global.tls.enabled }}
  annotations:
    {{- if .Values.global.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.global.tls.clusterIssuer }}
    {{- end }}
    # Redirect http to https and send HSTS (templates/traefik/*.yaml, same namespace as this Ingress).
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-redirect-https@kubernetescrd,%s-hsts@kubernetescrd" .Values.namespaces.gateway .Values.namespaces.gateway | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingressClassName }}
  {{- if .Values.global.tls.enabled }}
  tls:
    - hosts: [{{ .Values.global.appHost | quote }}]
      secretName: {{ printf "%s-app" .Values.global.tls.secretNamePrefix }}
  {{- end }}
  rules:
    - host: {{ .Values.global.appHost | quote }}
      http:
        paths:
          # Traefik matches the longest prefix first, so /api and /mcp stay with the gateway and every
          # other path goes to the dashboard.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
          {{- if .Values.dashboard.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  name: http
          {{- end }}
{{- end }}