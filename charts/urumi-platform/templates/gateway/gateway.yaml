{{- if .Values.gateway.enabled }}
{{- $ns := .Values.namespaces.gateway -}}
{{- $g := .Values.gateway -}}
{{- $name := "gateway" -}}
{{- $sec := default "gateway-secrets" .Values.secrets.existing.gatewaySecrets -}}
{{- $boot := default "gateway-bootstrap" .Values.secrets.existing.gatewayBootstrap -}}
{{- $wooTok := default "mcp-woocommerce-token" .Values.secrets.existing.mcpWoocommerceToken -}}
{{- $notesTok := default "mcp-notes-token" .Values.secrets.existing.mcpNotesToken -}}
{{- $utilsKey := default "mcp-utilities-key" .Values.secrets.existing.mcpUtilitiesKey -}}
{{- /* Created by scripts/create-secrets.ps1, never by the chart; referenced with optional: true. */ -}}
{{- $llmKeys := default "llm-api-keys" .Values.secrets.existing.llmApiKeys -}}
{{- if and $g.llm.fallbackProvider (eq $g.llm.fallbackProvider $g.llm.provider) -}}
{{- fail "gateway.llm.fallbackProvider must differ from gateway.llm.provider (or be empty)" -}}
{{- end -}}
{{- /* The Host check compares the hostname only (ADR-007), so ports are not listed. */ -}}
{{- $hosts := list .Values.global.appHost $name (printf "%s.%s" $name $ns) (printf "%s.%s.svc" $name $ns) (printf "%s.%s.svc.cluster.local" $name $ns) "127.0.0.1" "localhost" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" $name "component" "gateway") | nindent 4 }}
spec:
  selector:
    {{- include "urumi.selectorLabels" (dict "root" $ "name" $name) | nindent 4 }}
  ports:
    - name: http
      port: {{ $g.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" $name "component" "gateway") | nindent 4 }}
spec:
  replicas: 1
  # One pod at a time: a rollout stops the old pod before the new one starts (a few seconds of
  # downtime) instead of overlapping two replicas, whose in-memory server state, login limiter and
  # startup migration/seed would race.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "urumi.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "urumi.podLabels" (dict "root" $ "name" $name "component" "gateway") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gateway/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      # preStop 5 s + the gateway's 25 s drain of in-flight requests, with room for the last steps.
      terminationGracePeriodSeconds: 35
      securityContext:
        {{- include "urumi.podSecurityContext" (dict "uid" 1000 "gid" 1000) | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "urumi.image" (dict "root" $ "repository" $g.image.repository "tag" $g.image.tag) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "urumi.containerSecurityContext" $ | nindent 12 }}
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: {{ $g.port }}
          # Gives the endpoint removal time to reach Traefik before SIGTERM stops new connections.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          env:
            - name: PORT
              value: {{ $g.port | quote }}
            - name: LOG_LEVEL
              value: {{ $g.logLevel | quote }}
            - name: PUBLIC_APP_URL
              value: {{ include "urumi.publicUrl" (dict "root" $ "host" .Values.global.appHost) | quote }}
            - name: COOKIE_SECURE
              value: {{ eq .Values.global.publicScheme "https" | quote }}
            - name: MCP_ALLOWED_HOSTS
              value: {{ join "," $hosts | quote }}
            # Traefik is the single proxy hop in front of the gateway.
            - name: TRUST_PROXY
              value: "1"
            - name: MCP_AUTH_FAILURE_LIMIT_PER_MIN
              value: {{ $g.mcpAuthFailureLimitPerMin | quote }}
            - name: SSRF_ALLOWED_INTERNAL_HOSTS
              value: {{ include "urumi.ssrfAllowedHosts" . | quote }}
            - name: GATEWAY_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ $sec }}, key: encryption-key } }
            - name: GATEWAY_INTERNAL_TOKEN_SECRET
              valueFrom: { secretKeyRef: { name: {{ $sec }}, key: internal-token-secret } }
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: {{ $boot }}, key: email } }
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $boot }}, key: password } }
            - name: SEED_SERVERS
              valueFrom: { configMapKeyRef: { name: gateway-config, key: SEED_SERVERS } }
            {{- if .Values.mcpWoocommerce.enabled }}
            - name: SEED_WOO_TOKEN
              valueFrom: { secretKeyRef: { name: {{ $wooTok }}, key: token } }
            {{- end }}
            {{- if .Values.mcpNotes.enabled }}
            - name: SEED_NOTES_TOKEN
              valueFrom: { secretKeyRef: { name: {{ $notesTok }}, key: token } }
            {{- end }}
            {{- if .Values.mcpUtilities.enabled }}
            - name: SEED_UTILS_KEY
              valueFrom: { secretKeyRef: { name: {{ $utilsKey }}, key: key } }
            {{- end }}
            - name: PGHOST
              value: {{ printf "postgres.%s.svc.cluster.local" $ns | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: gateway
            - name: PGUSER
              value: gateway
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ $sec }}, key: postgres-password } }
            - name: UPSTREAM_HEALTH_INTERVAL_MS
              value: {{ $g.healthIntervalMs | quote }}
            - name: UPSTREAM_HEALTH_TIMEOUT_MS
              value: {{ $g.healthTimeoutMs | quote }}
            - name: UPSTREAM_CALL_TIMEOUT_MS
              value: {{ $g.callTimeoutMs | quote }}
            # AI chat. Provider and model names only; the keys come from the llm-api-keys Secret below.
            - name: LLM_PROVIDER
              value: {{ $g.llm.provider | quote }}
            - name: LLM_MODEL
              value: {{ $g.llm.model | quote }}
            - name: LLM_BASE_URL
              value: {{ $g.llm.baseUrl | quote }}
            - name: LLM_FALLBACK_PROVIDER
              value: {{ $g.llm.fallbackProvider | quote }}
            - name: LLM_FALLBACK_MODEL
              value: {{ $g.llm.fallbackModel | quote }}
            - name: LLM_TIMEOUT_MS
              value: {{ $g.llm.timeoutMs | quote }}
            - name: LLM_MAX_RETRIES
              value: {{ $g.llm.maxRetries | quote }}
            - name: LLM_MAX_OUTPUT_TOKENS
              value: {{ $g.llm.maxOutputTokens | quote }}
            - name: CHAT_TURN_TIMEOUT_MS
              value: {{ $g.chat.turnTimeoutMs | quote }}
            - name: CHAT_MAX_STEPS
              value: {{ $g.chat.maxSteps | quote }}
            - name: CHAT_RATE_LIMIT_PER_MIN
              value: {{ $g.chat.rateLimitPerMin | quote }}
            # Guardrails (ADR-018): the on-topic check and the per-user daily token budget.
            - name: CHAT_TOPIC_CHECK
              value: {{ $g.chat.topicCheck | quote }}
            - name: CHAT_TOPIC_CHECK_MODEL
              value: {{ $g.chat.topicCheckModel | quote }}
            - name: CHAT_TOPIC_CHECK_TIMEOUT_MS
              value: {{ $g.chat.topicCheckTimeoutMs | quote }}
            - name: CHAT_DAILY_TOKEN_BUDGET
              value: {{ $g.chat.dailyTokenBudget | int | quote }}
            # The same zone the store uses, so "today" means the same day in chat and in WooCommerce.
            - name: STORE_TIMEZONE
              value: {{ .Values.storeSetup.timezone | quote }}
            # optional: true, so a missing Secret (or key) never blocks the pod: chat then answers
            # LLM_NOT_CONFIGURED. After changing the Secret, restart the gateway (create-secrets.ps1 does).
            - name: GROQ_API_KEY
              valueFrom: { secretKeyRef: { name: {{ $llmKeys }}, key: GROQ_API_KEY, optional: true } }
            - name: OPENROUTER_API_KEY
              valueFrom: { secretKeyRef: { name: {{ $llmKeys }}, key: OPENROUTER_API_KEY, optional: true } }
          # /readyz checks the database only, never the upstreams, so a fresh `helm --wait` cannot deadlock.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # 110 x 2 s (220 s) covers the 90 x 2 s (180 s) database retry at startup, which in turn covers a cold pull of the Postgres image on a first install (about 2 min seen on 2026-10-23).
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 110
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}