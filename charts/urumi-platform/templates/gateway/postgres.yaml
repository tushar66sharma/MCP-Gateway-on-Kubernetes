{{- if .Values.gateway.enabled }}
{{- $ns := .Values.namespaces.gateway -}}
{{- $gwSecret := default "gateway-secrets" .Values.secrets.existing.gatewaySecrets -}}
# Headless Service: gives the StatefulSet pod a stable DNS name (postgres.gateway.svc.cluster.local).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" "postgres" "component" "database") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "urumi.selectorLabels" (dict "root" $ "name" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" "postgres" "component" "database") | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "urumi.selectorLabels" (dict "root" $ "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "urumi.podLabels" (dict "root" $ "name" "postgres" "component" "database") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The official image's postgres user is uid/gid 999.
        {{- include "urumi.podSecurityContext" (dict "uid" 999 "gid" 999) | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "urumi.containerSecurityContext" $ | nindent 12 }}
          env:
            - name: POSTGRES_USER
              value: gateway
            - name: POSTGRES_DB
              value: gateway
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $gwSecret }}, key: postgres-password } }
            # A subdirectory: the volume root holds lost+found on some storage classes, which initdb rejects.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec: { command: ["pg_isready", "-U", "gateway", "-d", "gateway", "-h", "127.0.0.1"] }
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "gateway", "-d", "gateway", "-h", "127.0.0.1"] }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "gateway", "-d", "gateway", "-h", "127.0.0.1"] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  # PVCs created from volumeClaimTemplates are not Helm-managed: they survive `helm uninstall`.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "urumi.selectorLabels" (dict "root" $ "name" "postgres") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.global.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}