{{- if .Values.gateway.enabled }}
{{- $gwNs := .Values.namespaces.gateway -}}
{{- $mcpNs := .Values.namespaces.mcp -}}
{{- $labels := include "urumi.labels" (dict "root" $ "name" "gateway" "component" "gateway") -}}
{{- if not .Values.secrets.existing.gatewaySecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: {{ $gwNs }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ include "urumi.generatedValue" (dict "root" $ "namespace" $gwNs "secret" "gateway-secrets" "key" "postgres-password" "length" 32) | b64enc | quote }}
  # 32 random bytes, base64 (what the helper returns), then base64 again for the Secret data field.
  encryption-key: {{ include "urumi.generatedValue" (dict "root" $ "namespace" $gwNs "secret" "gateway-secrets" "key" "encryption-key" "length" 32 "random" "bytes") | b64enc | quote }}
  internal-token-secret: {{ include "urumi.generatedValue" (dict "root" $ "namespace" $gwNs "secret" "gateway-secrets" "key" "internal-token-secret" "length" 48) | b64enc | quote }}
{{- end }}
{{- if not .Values.secrets.existing.gatewayBootstrap }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-bootstrap
  namespace: {{ $gwNs }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  email: {{ .Values.gateway.bootstrapAdminEmail | b64enc | quote }}
  password: {{ include "urumi.generatedValue" (dict "root" $ "namespace" $gwNs "secret" "gateway-bootstrap" "key" "password" "length" 20) | b64enc | quote }}
{{- end }}
{{- /* Copies of the MCP servers' credentials: Secrets cannot be shared across namespaces. The canonical
       namespace stays "mcp" so the values are identical to the originals. */}}
{{- if and .Values.mcpWoocommerce.enabled (not .Values.secrets.existing.mcpWoocommerceToken) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-woocommerce-token
  namespace: {{ $gwNs }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ include "urumi.generatedValue" (dict "root" $ "namespace" $mcpNs "secret" "mcp-woocommerce-token" "key" "token" "length" 48) | b64enc | quote }}
{{- end }}
{{- if and .Values.mcpNotes.enabled (not .Values.secrets.existing.mcpNotesToken) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-notes-token
  namespace: {{ $gwNs }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ include "urumi.generatedValue" (dict "root" $ "namespace" $mcpNs "secret" "mcp-notes-token" "key" "token" "length" 48) | b64enc | quote }}
{{- end }}
{{- if and .Values.mcpUtilities.enabled (not .Values.secrets.existing.mcpUtilitiesKey) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-utilities-key
  namespace: {{ $gwNs }}
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  key: {{ include "urumi.generatedValue" (dict "root" $ "namespace" $mcpNs "secret" "mcp-utilities-key" "key" "key" "length" 48) | b64enc | quote }}
{{- end }}
{{- end }}