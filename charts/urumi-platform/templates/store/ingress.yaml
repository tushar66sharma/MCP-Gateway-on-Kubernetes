{{- if .Values.store.enabled }}
{{- $ns := .Values.namespaces.store -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" $ "name" "wordpress" "component" "store") | nindent 4 }}
  {{- if .Values.global.tls.enabled }}
  annotations:
    {{- if .Values.global.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.global.tls.clusterIssuer }}
    {{- end }}
    # Redirect http to https and send HSTS (templates/traefik/*.yaml, same namespace as this Ingress).
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-redirect-https@kubernetescrd,%s-hsts@kubernetescrd" $ns $ns | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingressClassName }}
  {{- if .Values.global.tls.enabled }}
  tls:
    - hosts: [{{ .Values.global.storeHost | quote }}]
      secretName: {{ printf "%s-store" .Values.global.tls.secretNamePrefix }}
  {{- end }}
  rules:
    - host: {{ .Values.global.storeHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  name: http
{{- end }}
