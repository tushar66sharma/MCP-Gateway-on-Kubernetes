# Default values. Environment-specific overrides live in deploy/values-*.yaml.
# Never put secrets in any values file: credentials are generated into Kubernetes
# Secrets by the chart, or supplied as pre-created Secrets via secrets.existing.*.

global:
  storeHost: store.localhost
  appHost: app.localhost
  publicScheme: http          # http locally; https in production
  publicPort: 80              # host port users browse on; omitted from URLs when it is the scheme default
  ingressClassName: traefik
  storageClass: ""            # "" = cluster default (local-path on k3s/k3d)
  imagePullPolicy: IfNotPresent
  imageRegistry: ""          # e.g. ghcr.io/<user> in production; "" = local images imported into k3d
  imageTag: dev               # overridden locally by deploy/.images.local.yaml written by scripts/build-images.ps1
  tls:
    enabled: false
    clusterIssuer: ""         # cert-manager ClusterIssuer name (production)
    secretNamePrefix: urumi-tls

namespaces:
  store: store
  mcp: mcp
  gateway: gateway

# false = no store in this cluster (no WordPress, MariaDB, setup Job, wp-cron, store Ingress, store namespace
# or store policies). Then mcpWoocommerce.externalStore.url is required. See docs/deployment.md and ADR-019.
store:
  enabled: true

# Pod Security Admission level enforced (and warned/audited) on the three app namespaces. See ADR-017.
podSecurity:
  level: restricted           # restricted | baseline | privileged

# Pre-created Secrets (production). Empty = the chart generates them.
secrets:
  existing:
    storeDb: ""       # keys: root-password, password
    storeAdmin: ""    # keys: password
    storeWooApi: ""   # keys: consumer-key, consumer-secret
    mcpWoocommerceToken: ""   # key: token (also needed in namespace gateway)
    mcpNotesToken: ""         # key: token (also needed in namespace gateway)
    mcpUtilitiesKey: ""       # key: key (also needed in namespace gateway)
    gatewaySecrets: ""        # namespace gateway; keys: postgres-password, encryption-key (base64 of 32 bytes), internal-token-secret
    gatewayBootstrap: ""      # namespace gateway; keys: email, password
    # namespace gateway; keys: GROQ_API_KEY, OPENROUTER_API_KEY. Never generated by the chart: created by
    # scripts/create-secrets.ps1 from .env. "" = the name llm-api-keys. Optional: without it chat is disabled.
    llmApiKeys: ""

mariadb:
  image: mariadb:11.8.9
  database: wordpress
  user: wordpress
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

wordpress:
  image: wordpress:7.1.3-php8.3-apache
  tablePrefix: wp_
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  # WordPress scheduled work (WP-Cron, WooCommerce Action Scheduler). true = DISABLE_WP_CRON in WordPress plus
  # the wp-cron CronJob running `wp cron event run --due-now`, so nothing depends on WordPress reaching its own
  # public URL (blocked by the NetworkPolicies on a VPS). false = WordPress's built-in loopback WP-Cron.
  cron:
    enabled: true
    schedule: "*/5 * * * *"
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }

storeSetup:
  enabled: true
  image: wordpress:cli-2.12.0-php8.3
  woocommerceVersion: "11.2.1"
  siteTitle: Urumi Demo Store
  adminUser: admin
  adminEmail: admin@example.com
  # Login of the shop_manager user that owns the MCP server's WooCommerce REST API key.
  mcpKeyOwner: urumi-mcp
  currency: USD
  country: "US:CA"
  timezone: Asia/Kolkata
  seedProducts: true
  # Let shoppers create accounts (My Account and checkout). There is no CAPTCHA or email verification,
  # so production sets this to false.
  customerRegistration: true
  # Must be shorter than deploy.ps1's --timeout (10m) so a stuck Job fails the release with a clear reason.
  activeDeadlineSeconds: 480
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

mcpWoocommerce:
  enabled: true
  image:
    repository: urumi/mcp-woocommerce
    tag: ""               # "" = global.imageTag
  port: 3001
  timeoutMs: 10000
  logLevel: info
  # A WooCommerce store hosted elsewhere (ADR-019). "" = the in-cluster store with OAuth 1.0a (today's mode).
  # Set url (https only) to use HTTP Basic over https instead; the REST key and secret come from existingSecret.
  externalStore:
    url: ""                   # e.g. https://shop.example.com
    existingSecret: ""        # a Secret in the mcp namespace; keys: consumer-key, consumer-secret. Required with url.
    extraEgressCIDRs: []      # IPv4 CIDRs reachable on 443 in addition to the public internet (a store on a private network)
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 200m, memory: 160Mi }

mcpNotes:
  enabled: true
  image:
    repository: urumi/mcp-notes
    tag: ""               # "" = global.imageTag
  port: 3002
  logLevel: info
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 200m, memory: 160Mi }

mcpUtilities:
  enabled: true
  image:
    repository: urumi/mcp-utilities
    tag: ""               # "" = global.imageTag
  port: 3003
  logLevel: info
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 200m, memory: 160Mi }

postgres:
  image: postgres:17.11-bookworm
  storage: 1Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

gateway:
  enabled: true
  image:
    repository: urumi/gateway
    tag: ""               # "" = global.imageTag
  port: 3000
  logLevel: info
  bootstrapAdminEmail: admin@example.com
  healthIntervalMs: 15000
  healthTimeoutMs: 5000
  callTimeoutMs: 20000    # must stay greater than mcpWoocommerce.timeoutMs (10000)
  mcpAuthFailureLimitPerMin: 30   # audited /mcp auth failures per client IP per minute, then 429
  # MCP servers that run inside this cluster, outside the three built-in ones. Each entry opens its namespace
  # in the gateway's SSRF allow-list (*.<namespace>.svc.cluster.local) and gives the gateway egress to that
  # namespace on TCP <port> (only pods matching podLabels when given). For a namespace equal to namespaces.mcp the
  # chart also renders the Ingress NetworkPolicy; other namespaces must admit the gateway in their own policies.
  # Default: none.
  internalUpstreams: []
  #  - namespace: tools          # DNS label
  #    port: 3010                # TCP port of the server (1-65535)
  #    podLabels:                # optional: only pods with these labels
  #      app.kubernetes.io/name: my-mcp-server
  # AI chat model. Names only: the API keys live in the llm-api-keys Secret (secrets.existing.llmApiKeys).
  llm:
    provider: groq          # groq | openrouter
    model: ""               # "" = the provider's default model
    baseUrl: ""             # "" = the provider's default API URL
    fallbackProvider: ""    # "" = no fallback; otherwise groq | openrouter, different from provider
    fallbackModel: ""       # "" = the fallback provider's default model
    timeoutMs: 30000        # one LLM request
    maxRetries: 2
    maxOutputTokens: 1024   # cap on every main-model answer (256-4096)
  chat:
    turnTimeoutMs: 60000    # a whole chat turn, tool calls included
    maxSteps: 8             # tool-calling rounds per turn
    rateLimitPerMin: 10     # turns per user per minute
    topicCheck: true        # a small model refuses off-topic messages before the main model runs (ADR-018)
    topicCheckModel: ""     # "" = the provider default (Groq: openai/gpt-oss-20b; OpenRouter: the main model)
    topicCheckTimeoutMs: 5000
    dailyTokenBudget: 50000 # tokens per user per day in storeSetup.timezone; 0 = unlimited
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 384Mi }

# The web dashboard (static files served by unprivileged nginx), routed at "/" on global.appHost.
# Rendered only when gateway.enabled is true too.
dashboard:
  enabled: true
  image:
    repository: urumi/dashboard
    tag: ""               # "" = global.imageTag
  port: 8080              # fixed by apps/dashboard/nginx.conf
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }

# Default-deny NetworkPolicies for the three app namespaces plus explicit allow rules (ADR-016).
# Needs a CNI that enforces them (k3s: the embedded kube-router controller).
networkPolicies:
  enabled: true
