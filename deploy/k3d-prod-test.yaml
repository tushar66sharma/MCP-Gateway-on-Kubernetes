# Temporary second k3d cluster for the production rehearsal (scripts\prod-rehearsal.ps1). Not the local
# development cluster: that one is called urumi and keeps host ports 80 and 443.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: urumi-prod
servers: 1
agents: 0
ports:
  # Host port 8081, not 8080: 8080 is often taken on a developer machine (an Apache httpd held it on 2026-10-23).
  - port: 127.0.0.1:8081:80
    nodeFilters: [loadbalancer]
  - port: 127.0.0.1:8443:443
    nodeFilters: [loadbalancer]
