# Production-like k3s VPS environment — STUB, completed in Phase 5 (see docs/deployment.md).
# Never put secrets in this file: create the Secrets named below with kubectl first.
# The chart owns the namespaces, so create "store" (and "mcp") WITH Helm ownership labels/annotations
# before creating the Secrets: see "Pre-created Secrets" in docs/deployment.md (expected; verified in Phase 5).
global:
  # Our own images (urumi/<app>) are pulled from this registry with this tag. Replace both before deploying.
  imageRegistry: ghcr.io/CHANGE-ME
  imageTag: CHANGE-ME
  storeHost: store.example.com
  appHost: app.example.com
  publicScheme: https
  publicPort: 443
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
secrets:
  existing:
    storeDb: store-db            # must exist in namespace "store"
    storeAdmin: store-admin      # must exist in namespace "store"
    storeWooApi: store-woo-api   # must exist in "store" (and in "mcp" from Phase 2)
    mcpWoocommerceToken: mcp-woocommerce-token   # must exist in "mcp" AND "gateway" (key: token)
    mcpNotesToken: mcp-notes-token       # must exist in "mcp" AND "gateway" (key: token)
    mcpUtilitiesKey: mcp-utilities-key   # must exist in "mcp" AND "gateway" (key: key)
    gatewaySecrets: gateway-secrets      # must exist in "gateway" (keys: postgres-password, encryption-key = base64 of 32 bytes, internal-token-secret)
    gatewayBootstrap: gateway-bootstrap  # must exist in "gateway" (keys: email, password)
    llmApiKeys: llm-api-keys             # optional, in "gateway" (keys: GROQ_API_KEY, OPENROUTER_API_KEY); without it chat is disabled
