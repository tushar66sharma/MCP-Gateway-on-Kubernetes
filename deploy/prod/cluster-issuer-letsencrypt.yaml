# Let's Encrypt (production) via the ACME HTTP-01 challenge, solved through Traefik.
# Replace CHANGE-ME with a real email address (Let's Encrypt writes to it about expiring certificates), then:
#   kubectl apply -f deploy/prod/cluster-issuer-letsencrypt.yaml
# Needs cert-manager installed and port 80 reachable from the internet. Not executed in this project:
# it depends on a real domain and DNS.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: CHANGE-ME@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
